<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento aprovado</title>
  <link rel="icon" type="image/png" sizes="16x16" href="../imagens/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../imagens/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="../imagens/favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="180x180" href="../imagens/favicon-180x180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../imagens/favicon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="../imagens/favicon-512x512.png">
  <link rel="icon" href="../imagens/favicon.ico">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Garante que a página ocupe toda a tela e centralize o card */
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f0f2f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* O card centralizado */
    .card {
        background: #ffffff;
        padding: 40px;
        border-radius: 24px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        width: 90%;
        max-width: 400px;
        text-align: center;
        box-sizing: border-box;
    }

    /* Estilo do título */
    .card h1 {
        color: #1a1a1a;
        font-size: 1.6rem;
        margin: 0 0 16px 0;
        padding: 0;
    }

    /* Estilo do texto */
    .card p {
        color: #666;
        margin: 0 0 24px 0;
        font-size: 1rem;
    }

    /* Caixa da chave */
    .key-box {
        background-color: #f8f9fa;
        border: 2px dashed #d1d5db;
        padding: 16px;
        border-radius: 12px;
        font-family: 'Courier New', Courier, monospace;
        font-size: 1.25rem;
        font-weight: bold;
        color: #4f46e5;
        margin: 0 0 24px 0;
        letter-spacing: 1px;
    }

    /* Botão */
    .btn {
        background-color: #4f46e5;
        color: white;
        border: none;
        padding: 14px 28px;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        transition: background 0.3s ease;
    }

    .btn:hover {
        background-color: #4338ca;
    }
    canvas#confetti { position:fixed; inset:0; pointer-events:none; }
    </style>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MGNJN8V316">
    </script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-MGNJN8V316');
    </script>
</head>
<body>
<canvas id="confetti" style="position: fixed; top: 0; left: 0; pointer-events: none; z-index: 0;"></canvas>

<div class="card">
  <div class="center">
    <h1>Pagamento aprovado! 🎉</h1>
    <p>Sua chave enviada por e-mail é:</p>
    <div class="key-box" id="approvedKey"></div>
    <button id="btnCopiar" class="btn" onclick="copiarChave()">Copiar Chave</button>
  </div>
</div>

<script>

    const dados = JSON.parse(localStorage.getItem('pagamento_pix'));
    document.getElementById("approvedKey").innerText = dados.chave;

    const response = await fetch(`https://backend-g123.onrender.com/incrementar/compras`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        }
    });

    if (!response.ok) {
        throw new Error('Error in communication with the server: ' + response.statusText);
    }

    const data = await response.json();
    console.log("Success:", data.message);
           

    function startConfetti() {
        const canvas = document.getElementById("confetti");
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Criação das partículas
        const pieces = Array.from({ length: 220 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height - canvas.height,
            r: 4 + Math.random() * 6,
            s: 2 + Math.random() * 4,
            a: Math.random() * Math.PI * 2,
            type: Math.random() > 0.5 ? 'circle' : 'rect',
            c: `hsl(${Math.random() * 360}, 100%, 50%)`
        }));

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            pieces.forEach(p => {
                p.y += p.s;
                p.x += Math.sin(p.a) * 2;
                p.a += 0.05;

                ctx.fillStyle = p.c;
                ctx.beginPath();
                if (p.type === 'circle') {
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                } else {
                    ctx.rect(p.x, p.y, p.r * 2, p.r);
                }
                ctx.fill();

                // Reposiciona no topo ao sair da tela para efeito constante
                if (p.y > canvas.height) {
                    p.y = -20;
                    p.x = Math.random() * canvas.width;
                }
            });
            requestAnimationFrame(animate);
        }
        animate();
    }

    // Função de copiar chave
    function copiarChave() {
        const textoChave = document.getElementById("approvedKey").innerText;
        const botao = document.getElementById("btnCopiar");

        navigator.clipboard.writeText(textoChave).then(() => {
            const textoOriginal = botao.innerText;
            botao.innerText = "Copiado!";
            botao.style.backgroundColor = "#28a745";

            setTimeout(() => {
                botao.innerText = textoOriginal;
                botao.style.backgroundColor = "";
            }, 2000);
        }).catch(err => {
            console.error('Erro ao copiar: ', err);
            alert('Falha ao copiar.');
        });
    }

    // Inicia o efeito ao carregar a página
    window.onload = startConfetti;
</script>
</body>
</html>
