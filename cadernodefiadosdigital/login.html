<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar / Cadastro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="auth-wrap">
  <div class="card">
    <h1>Entrar</h1>
    <p>Entre com seu e-mail e CPF. Se ainda não existir cadastro, ele será criado.</p>
    <form id="loginForm">
      <label>Nome (opcional)
        <input type="text" id="nome" maxlength="120">
      </label>
      <label>E-mail *
        <input type="email" id="email" required>
      </label>
      <label>CPF *
        <input type="text" id="cpf" required placeholder="somente números">
      </label>
      <button class="btn btn-primary" type="submit" style="margin-top:18px;width:100%;">Entrar / Cadastrar</button>
      <div id="msg" class="error"></div>
    </form>
  </div>
</div>
<script src="main.js"></script>
</body>
</html>
<style>
  :root { --primary:#4B0082; --secondary:#28A745; --bg-dark:#2C3E50; --text:#333; --light:#eef2f5; }
body { font-family:'Segoe UI',sans-serif; margin:0; color:var(--text); }
.navbar { display:flex; justify-content:space-between; align-items:center; padding:1rem 10%; background:var(--bg-dark); color:white; }
.feature { display:flex; padding:4rem 10%; align-items:center; gap:3rem; background:white; }
.feature.alternate { background:var(--light); }
.ctas { display:flex; justify-content:center; gap:1rem; flex-wrap:wrap; margin-top:1.5rem; }
.btn { width:200px; padding:15px 0; border:none; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:1rem; text-decoration:none; transition:transform .2s; }
.btn:hover { transform:translateY(-2px); }
.btn-primary { background:var(--primary); color:white; }
.btn-secondary { background:var(--secondary); color:white; }
.avatar-btn { background:#fff; border:1px solid #e2e8f0; padding:8px 20px; border-radius:50px; cursor:pointer; display:flex; align-items:center; gap:10px; }
.auth-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; background:#eef2f5; padding:24px; }
.error { color:#b91c1c; margin-top:12px; }
.success { color:#166534; margin-top:12px; }
.info-box { background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:18px; margin-top:18px; }
.key-box { margin-top:12px; font-size:1.2rem; font-weight:700; background:#111827; color:#fff; padding:14px; border-radius:10px; text-align:center; letter-spacing:1px; }
.footer { text-align:center; padding:20px; background:var(--bg-dark); color:var(--light); }
.center { text-align:center; }
.spinner { width:50px; height:50px; border:5px solid #ddd; border-top-color:var(--primary); border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 20px; }
@keyframes spin { to { transform:rotate(360deg);} }
canvas#confetti { position:fixed; inset:0; pointer-events:none; }

</style>
