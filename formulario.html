<form id="checkout-form">
    <input type="text" id="nome" placeholder="Seu Nome" required>
    <input type="email" id="email" placeholder="Seu E-mail" required>
    <input type="text" id="cpf" placeholder="Seu CPF" required>
    <button type="submit">Finalizar Compra</button>
</form>

<script>
    document.getElementById('checkout-form').addEventListener('submit', async (e) => {
        e.preventDefault(); // Impede que a página recarregue ao clicar

        // Pega os valores que o cliente digitou
        const dados = {
            nome: document.getElementById('nome').value,
            email: document.getElementById('email').value,
            cpf: document.getElementById('cpf').value
        };

        // Envia para o seu servidor no Render
        const resposta = await fetch('https://backend-g123.onrender.com/create-order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dados)
        });

        if (resposta.ok) {
            const data = await resposta.json();
            // Redireciona o cliente para a página de pagamento do PagBank
            window.location.href = data.checkout_url;
        } else {
            alert('Erro ao processar o pedido. Tente novamente.');
        }
    });
</script>
